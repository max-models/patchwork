# Weekly update PRs for the GitHub Actions, the npm packages of the docs site and the Python
# dependencies. Pre-commit hook revisions are bumped by .github/workflows/pre_commit_autoupdate.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    # not the theme: it is installed from a git tag, which Dependabot compares wrongly (it
    # "updated" v0.3.1 to v0.2.0); bump it by hand with the docs workflow tag
    ignore:
      - dependency-name: "@max-models/starlight-theme"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
