name: Test Tutorials

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

env:
  # A PR to main or a push to main (the release) uses PyPI versions only; devel uses the
  # devel branches from [tool.uv.sources].
  UV_NO_SOURCES: ${{ (github.base_ref || github.ref_name) == 'main' }}

jobs:
  tutorials:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The newest release, not the runner's cached one: Astro raises its minimum often.
          check-latest: true
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install project
        run: |
          uv sync --extra docs
          uv run python -m ipykernel install --user --name python3
          cd docs && npm ci

      - name: Execute tutorials
        working-directory: docs
        run: DOCS_PYTHON="$(pwd)/../.venv/bin/python" npx starlight-notebooks execute --force
