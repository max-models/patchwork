[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
# The distribution name: "patchwork" on PyPI is an unrelated project. The import stays
# `import patchwork`.
name = "patchwork-amr"
version = "0.2.0"
description = "Block-structured adaptive meshes backed by mpiarray."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # the kernel dispatch and the Pyccel build cache (cunumpy.kernels)
  "cunumpy>=0.7.0",
  "maybempi>=0.1.2",
  "mpiarray>=0.2.1",
  # the per-patch deposit and interpolation (Weighting.scatter_block, gather_block)
  "mpifield>=0.1.0",
  "numpy",
  "scipy",
  "scope-profiler>=0.7.5",
]

[project.optional-dependencies]
mpi = [ "mpiarray[mpi]>=0.2.1" ]
# NodalPoisson(backend="petsc"): the solve distributed by rows over the ranks
petsc = [ "petsc4py" ]
plot = [ "matplotlib" ]
# the compiled kernels (locate); without it their NumPy versions run
pyccel = [ "pyccel>2.0" ]
dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "patchwork-amr[test,docs,plot]",
]
docs = [
  "griffe",
  "patchwork-amr[plot]",  # the tutorials draw figures
  "ipykernel",
  "nbclient>=0.11.0",
  "nbformat>=5.11.1",
]
test = [ "pytest", "pytest-cov", "patchwork-amr[pyccel]" ]

[project.urls]
Source = "https://github.com/max-models/patchwork"

[project.scripts]
patchwork = "patchwork.main:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "py.typed" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
ignore = [ "E501" ] # line length is handled by the formatter
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D" ]
per-file-ignores."*.ipynb" = [ "D" ]

[tool.pyright]
include = [ "src" ]
# the Pyccel kernels annotate in Pyccel's array dialect ("float[:]")
exclude = [ "**/tests", "src/patchwork/kernels/*/*_pyccel.py" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"

[tool.coverage.run]
source = [ "patchwork" ]
omit = [ "*/tests/*" ]

[tool.coverage.report]
show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
maybempi = { git = "https://github.com/max-models/maybempi", branch = "devel" }
mpiarray = { git = "https://github.com/max-models/mpiarray", branch = "devel" }
mpifield = { git = "https://github.com/max-models/mpifield", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
